name: Hub core bump

# Reusable workflow: opens (or updates) a PR bumping `hubBackendVersion` in a hub
# instance's build.gradle to a newly released hub core version.
#
# Called by a hub instance on `repository_dispatch: hub-released`, which the hub
# repo's Hub Release workflow fires for every instance listed in its committed
# .github/instance-subscribers.json.
#
# Rolling PR: all bumps reuse a single branch (default `chore/hub-core-bump`), so an
# instance has at most one open bump PR at a time, always retargeted to the newest
# version. It never merges — the instance's own PR checks decide whether the new hub
# core is safe for that instance.

on:
  workflow_call:
    secrets:
      actions-access-token:
        description: Token used to push the bump branch and open the PR.
        required: true
    inputs:
      version:
        description: "Hub core version to bump to, e.g. 3.176.0 (from the dispatch client_payload)."
        required: true
        type: string
      branch:
        description: "Rolling branch used for the bump PR."
        required: false
        type: string
        default: chore/hub-core-bump
      base:
        description: "Branch to open the PR against."
        required: false
        type: string
        default: master

jobs:
  bump:
    name: "Bump hub core to ${{ inputs.version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          token: ${{ secrets.actions-access-token }}

      - name: Bump hubBackendVersion
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # `version` originates from a repository_dispatch client_payload, which any
          # actor able to dispatch on this repo controls. It is interpolated into sed,
          # a branch name and a commit message, so constrain it to a plain version
          # literal before it is used anywhere.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to bump: '$VERSION' is not a bare X.Y.Z version"
            exit 1
          fi

          if [[ ! -f build.gradle ]]; then
            echo "::error::build.gradle not found"
            exit 1
          fi

          CURRENT=$(grep -oE "hubBackendVersion *= *'[^']+'" build.gradle | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [[ -z "$CURRENT" ]]; then
            echo "::error::could not find hubBackendVersion in build.gradle"
            exit 1
          fi
          echo "Current: $CURRENT -> target: $VERSION"

          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "Already on $VERSION; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Replace only the version literal, preserving the existing indentation/quoting.
          sed -i -E "s/(hubBackendVersion *= *')[^']+(')/\1${VERSION}\2/" build.gradle

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- build.gradle

      - name: Push bump branch
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git config user.name githubZenoo
          git config user.email github@zenoo.com
          git checkout -b "$BRANCH"
          git add build.gradle
          git commit -m "chore(deps): bump hub core to ${VERSION}"
          # Rolling branch: force-push so the single open PR always targets the newest
          # released version rather than accumulating one stale PR per release.
          git push --force origin "$BRANCH"

      - name: Open or update PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.actions-access-token }}
          VERSION: ${{ inputs.version }}
          CURRENT: ${{ steps.bump.outputs.current }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          TITLE="chore(deps): bump hub core to ${VERSION}"
          BODY=$(printf '%s\n' \
            "Automated bump of \`hubBackendVersion\`: \`${CURRENT}\` → \`${VERSION}\`." \
            "" \
            "Triggered by a hub core release. This instance is subscribed in \`hub/.github/instance-subscribers.json\`." \
            "" \
            "This PR is **not** auto-merged: the checks on it tell you whether this hub core version is safe for this instance. If they fail, the new hub core broke something here." \
            "" \
            "This is a rolling PR — a later hub core release force-updates this same branch rather than opening another PR.")

          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            echo "Updating existing PR #$EXISTING"
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
