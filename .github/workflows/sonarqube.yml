name: 'SonarQube Static Code Analysis (SCA)'

on:
  workflow_call:
    secrets:
      nexus-username:
        required: true
      nexus-password:
        required: true
      sonarqube-host:
        required: true
      sonarqube-token:
        required: true
      nvd-api-key:
        required: false
      nvd-datafeed-token:
        description: 'Bearer token to read the private NVD datafeed mirror (zenoolabs/nvd-mirror) over raw.githubusercontent. Usually ACTIONS_ACCESS_TOKEN.'
        required: false
      localstack-token:
        required: true
    inputs:
      cache-version:
        description: 'A cache version passed from the caller workflow'
        required: false
        type: string
        default: 'v1'
      sonar-project-key:
        description: 'Key of the project in SonarQube'
        required: true
        type: string
      full-run:
        description: 'Set to true to run with dependency check and report download'
        required: false
        type: boolean
        default: false
      parallel-forks:
        description: 'Maximum number of parallel forks for integration tests run'
        required: false
        type: number
        default: 1
      runner:
        description: "The runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      enable-dependency-cache:
        description: 'Enable dependency check caching'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: 'Run static code analysis'
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    env:
      ORG_GRADLE_PROJECT_nexusUsername: ${{ secrets.nexus-username }}
      ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.nexus-password }}
      ORG_GRADLE_PROJECT_localstackToken: ${{ secrets.localstack-token }}
      ORG_GRADLE_PROJECT_sonarqubeHostUrl: ${{ secrets.sonarqube-host }}
      ORG_GRADLE_PROJECT_sonarqubeLoginToken: ${{ secrets.sonarqube-token }}
      ORG_GRADLE_PROJECT_nvdApiKey: ${{ secrets.nvd-api-key }}
      # Bearer token for the private NVD datafeed mirror; build.gradle wires it into
      # nvd { datafeedBearerToken } so the cold NVD-API build is replaced by a fast
      # download from zenoolabs/nvd-mirror. See NWO-945.
      ORG_GRADLE_PROJECT_nvdDatafeedToken: ${{ secrets.nvd-datafeed-token }}
      ORG_GRADLE_PROJECT_parallelForks: ${{ inputs.parallel-forks }}
    steps:
      - name: 'Get current date'
        id: get-current-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 'Getting repository name'
        run: echo "GITHUB_REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: 'Print action context'
        run: |
          echo "Repository: ${{ env.GITHUB_REPO_NAME }}"
          echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup JDK 21'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: 'Grant execute permission for gradlew'
        run: chmod +x gradlew

      - name: 'Run build'
        run: ./gradlew clean build -x test

      - name: "Get version"
        id: get-version
        run: |
          VERSION=$(./gradlew cV -q -Prelease.quiet)
          echo "Running sonar for version v$VERSION"
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: 'Restore Dependency Check Cache'
        if: ${{ inputs.full-run == true && inputs.enable-dependency-cache == true }}
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          # Using date in cache key as OWASP database may change, without the gradle file changing
          key: dependency-check-data-${{ runner.os }}-${{ steps.get-current-date.outputs.date }}-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-${{ steps.get-current-date.outputs.date }}-
            dependency-check-data-${{ runner.os }}-
          path: ~/.gradle/dependency-check-data

      - name: 'Analyze dependencies'
        # Step timeout must stay below the job timeout (60m). Building the NVD database
        # from scratch can outlast the job, and a job-level cancellation kills the
        # runner outright — the 'Save Dependency Check Cache' step below would never
        # run, so the partial database would be lost and the next run would start cold
        # again. Failing the step instead keeps the job alive long enough to save what
        # was downloaded, so successive runs resume from a warmer database.
        timeout-minutes: 45
        if: ${{ inputs.full-run == true }}
        run: ./gradlew dependencyCheckAnalyze

      - name: 'Dependency-Check summary'
        # Render the JSON report into a findings table on the run's job summary, so the
        # results are visible without downloading and unzipping the HTML artifact. Runs
        # even if analyze failed (always) so partial/timeout results still surface, and
        # never fails the job itself. Requires the consumer's dependencyCheck block to
        # emit JSON (formats includes 'JSON'); if it doesn't, the step notes that no
        # JSON report was produced.
        if: ${{ always() && inputs.full-run == true }}
        run: |
          curl -fsSL -o /tmp/dep_check_summary.py \
            https://github.com/zenoolabs/github-actions/raw/main/scripts/dep_check_summary.py
          python3 /tmp/dep_check_summary.py ./build/reports/dependency-check-report.json || true

      - name: 'Save Dependency Check Cache'
        # always(): the NVD database must be persisted even when 'Analyze dependencies'
        # fails or is cancelled. Building it from scratch means paginating ~250k CVEs
        # through a heavily throttled NVD API, which can exceed this job's timeout. With
        # the default (success-only) condition the partial database is thrown away, so
        # the next run starts cold again and hits the same timeout — the cache is never
        # written and every run rebuilds from zero. Saving on failure lets successive
        # runs resume from the partial database until it is complete.
        if: ${{ always() && inputs.full-run == true && inputs.enable-dependency-cache == true }}
        uses: actions/cache/save@v4
        id: cache-save
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ steps.get-current-date.outputs.date }}-${{ hashFiles('**/build.gradle') }}

      - name: 'Run SonarQube'
        run: |
          ./gradlew check sonar \
            -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
            -Dsonar.projectName=${{ inputs.sonar-project-key }} \
            -Dsonar.host.url=${{ secrets.sonarqube-host }} \
            -Dsonar.token=${{ secrets.sonarqube-token }} \
            -Dsonar.projectVersion=${{ steps.get-version.outputs.version }}

      - name: 'Download Sonar CNES Report tool'
        if: ${{ inputs.full-run == true }}
        run: curl -L -O https://github.com/zenoolabs/github-actions/raw/main/bin/sonar-cnes-report-5.0.1-zenoo.jar

      - name: 'Acquire Sonar Report'
        if: ${{ inputs.full-run == true }}
        run: java -jar sonar-cnes-report-5.0.1-zenoo.jar -s ${{ secrets.sonarqube-host }} -t ${{ secrets.sonarqube-token }} -p ${{ inputs.sonar-project-key }}

      - name: 'Attach Sonar report'
        if: ${{ inputs.full-run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: 'sonar-analysis-report'
          path: ./${{ steps.get-current-date.outputs.date }}-${{ inputs.sonar-project-key }}-analysis-report.docx

      - name: 'Attach dependency check report'
        if: ${{ inputs.full-run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: 'dependency-check-report'
          path: ./build/reports/dependency-check-report.html

      - name: "Create summary"
        run: |
          echo "Executed sonar task for version ${{ steps.get-version.outputs.version }} on ${{ steps.get-current-date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
